// 줌별 선 굵기(px). 같은 길을 함께 지나는 노선은 굵기만큼씩 붙여서 길 중심에 모은다.
const lineW = z => (z = Math.floor(z)) >= 15 ? 5 : z === 14 ? 4 : z === 13 ? 3 : 2;

// ?capture: 캡처용 화면 (확대/축소 버튼·설명 숨김, 대상 영역에 딱 맞는 소수점 줌). src/capture.py 가 쓴다.
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');
// 모바일(좁은 화면): 범례를 접고 시작, 줌은 0.25 단위로 맞춰 옥정 범위를 화면에 꽉 채운다.

const map = L.map('map', { zoomSnap: CAPTURE ? 0 : NARROW ? 0.25 : 1, zoomControl: !CAPTURE });

// OSM 타일 서버는 Referer 없는 요청(file:// 로 연 페이지)을 "Access blocked" 로 막는다.

const order = META.routes.map(r => r.routeName);
const orderIdx = Object.fromEntries(order.map((n, i) => [n, i]));
const colorOf = Object.fromEntries(META.routes.map(r => [r.routeName, r.color]));
const schedOf = Object.fromEntries(META.routes.map(r => [r.routeName, r.schedule]));
const visible = new Set(order);
let pinned = null;   // 범례에서 클릭해 고정한 노선
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = r => `<span class="badge" style="background:${colorOf[r]}">${esc(r)}</span>`;
const range = (a, b) => a == null ? '-' : (a === b || b == null ? `${a}분` : `${a}–${b}분`);
// 요일(범례 제목의 드롭다운): 범례 배차·선 설명·정류장 팝업·운행 빈도 보기가 모두 이 요일을 따른다.
const DAYS = { weekday: '평일', sat: '토요일', sun: '일요일' };
let day = 'weekday';
const alloc = (r, d = day) => { const s = schedOf[r]; return s && s[d + 'Min'] != null ? range(s[d + 'Min'], s[d + 'Max']) : '정보 없음'; };

// ── 운행 빈도: 길마다 선 하나, 켜진 노선들의 시간당 운행 횟수 합계를 색(연→진)과 굵기로 ──
// 노선 하나의 시간당 운행 횟수 = 60 / ((최소 배차 + 최대 배차) / 2). 합성 배차간격 = 60 / 합계.
let freqMode = false;
const FREQ_CLASSES = [  // 합성 배차간격(분) 상한, 색, 굵기(px, 줌 15 기준).
  // 색: 파랑 한 가지 5단계는 구분이 어렵다는 사용자 요청으로 여러 색조 순서형(연두→초록→청록→파랑→짙은 보라)으로 바꿈.
  // 밝기는 한 방향(진할수록 자주), 단계 간 ΔL ≥ 0.06, 가장 옅은 단계도 지도 바탕 대비 2.25:1 (validate_palette --ordinal).
  // 주황·분홍·노랑은 OSM 도로 색과 겹쳐서 피함.
  { max: 5, color: '#3a1670', w: 11, label: '5분 미만', sub: '시간당 12대 초과' },
  { max: 10, color: '#2b4f9c', w: 9, label: '5–9분', sub: '6–12대' },
  { max: 15, color: '#1a7690', w: 7, label: '10–14분', sub: '4–6대' },
  { max: 21, color: '#1f9670', w: 5, label: '15–20분', sub: '약 3–4대' },
  { max: Infinity, color: '#5fb536', w: 3, label: '21분 이상', sub: '약 3대 미만' },
];
const NO_DATA = { color: '#8a8a8a', w: 3, label: '배차 정보 없음', sub: '마을버스만 지나는 길' };
const freqScale = z => (z = Math.floor(z)) >= 15 ? 1 : z === 14 ? 0.8 : z === 13 ? 0.6 : 0.45;
const routeBph = r => {
  const s = schedOf[r], lo = s && s[day + 'Min'], hi = s && s[day + 'Max'];
  return lo ? 60 / ((lo + (hi || lo)) / 2) : null;
};
const freqLayer = L.layerGroup();

// 점마다 오프셋(slot × 선 굵기)을 적용해 투영하는 선. tan = 진행 방향 단위벡터(동, 북).
// 화면 좌표(y 아래)에서 진행 방향 오른쪽 법선 = (북, 동) 성분.
const BundleLine = L.Polyline.extend({
  _projectLatlngs(latlngs, result, projectedBounds) {
    const w = this.px || 0, slots = this.slots, tan = this.tan;
    result.push(latlngs.map((ll, i) => {
      const p = this._map.latLngToLayerPoint(ll);
      if (projectedBounds) projectedBounds.extend(p);
      const o = slots ? slots[i] * w : 0;
      return o ? L.point(p.x + o * tan[i][1], p.y + o * tan[i][0]) : p;
    }));
  }
});

const routeLines = {};
for (const f of LINES) {
  const line = new BundleLine(f.coords.map(([x, y]) => [y, x]),
                              { color: f.color, weight: 3, opacity: 0.9, className: 'route-line' });
  Object.assign(line, { routeName: f.routeName, direction: f.direction, tan: f.tan, nb: f.nb });
  line.bindTooltip(() => `${esc(f.routeName)}번 · ${DAYS[day]} 배차 ${alloc(f.routeName)}`, { sticky: true });
  line.on('mouseover', () => hoverOn(f.routeName));
  line.on('mouseout', hoverOff);
  line.on('click', e => { L.DomEvent.stopPropagation(e); segmentPopup(line, e.latlng); });
  (routeLines[f.routeName] ||= []).push(line);
}

// 점마다: 이 노선 + 같은 길을 지나는 켜진 노선 집합에서의 자리.
// 집합에서 표시 순서가 가장 앞선 노선(ref)의 진행 방향 오른쪽을 + 로 삼아 자리를 매기고,
// 이 노선이 ref 와 반대로 달리면 부호를 뒤집는다 (방향이 달라도 모두 같은 순서로 나란히 선다).
function computeSlots(line) {
  const self = orderIdx[line.routeName];
  const raw = line.nb.map(nb => {
    const S = [[self, 1]];
    for (const v of nb) { const q = Math.abs(v) - 1; if (visible.has(order[q])) S.push([q, Math.sign(v)]); }
    S.sort((a, b) => a[0] - b[0]);
    return (S.findIndex(s => s[0] === self) - (S.length - 1) / 2) * S[0][1];
  });
  // 공유 구간 경계의 잔떨림 제거: 중앙값(±2점, 약 ±40m) 후 이동평균(±2점)으로 자리 이동을 비스듬히 잇는다.
  const win = (a, i) => a.slice(Math.max(0, i - 2), i + 3);
  const med = raw.map((_, i) => { const w = win(raw, i).sort((a, b) => a - b); return w[w.length >> 1]; });
  return med.map((_, i) => { const w = win(med, i); return w.reduce((a, b) => a + b, 0) / w.length; });
}

function layoutLines() {
  const px = lineW(map.getZoom());
  for (const n of order) for (const l of routeLines[n]) {
    l.px = px;
    if (visible.has(n)) { l.slots = computeSlots(l); if (map.hasLayer(l)) l.redraw(); }
  }
}

// 정류장: 공유 정류장은 하나의 마커

const markers = STOPS.features.map(f => {

  }).bindPopup(() => `<div class="popup"><b>${esc(p.stationName)}</b><br>정류장번호: ${esc(p.mobileNo || '-')}<br>` +
    `정차 노선 (${DAYS[day]} 배차):<br>${p.routes.map(r => `${badge(r)}<span class="muted">${alloc(r)}</span>`).join(' ')}</div>`);
  m.routes = p.routes;

// 학교: 네모 아이콘(정류장 동그라미와 구분)에 학교급 글자(초·중·고)와 색 + 정식 이름. 축소 화면(줌 < 14)에서는 이름을 숨긴다.
// 노선 색이 9가지라 겹치지 않는 색은 없으므로 글자로 구분하고, 학교급마다 레이어를 따로 두어 범례에서 켜고 끈다.
const SCHOOL_LEVELS = [
  { level: '초등학교', mark: '초', cls: 'lv-e' },
  { level: '중학교', mark: '중', cls: 'lv-m' },
  { level: '고등학교', mark: '고', cls: 'lv-h' },
].filter(l => SCHOOLS.some(s => s.level === l.level));
const LABEL_OFFSET = { right: [8, 0], left: [-8, 0], top: [0, -8], bottom: [0, 8] };
const bindLabel = (m, dir) => {
  m.labelDir = dir;
  m.unbindTooltip().bindTooltip(esc(m.school.name), { permanent: true, direction: dir, offset: LABEL_OFFSET[dir], className: `school-label ${m.cls}` });
};
const schoolLayers = Object.fromEntries(SCHOOL_LEVELS.map(({ level, mark, cls }) => [level, L.layerGroup(
  SCHOOLS.filter(s => s.level === level).map(s => {
    const m = L.marker([s.lat, s.lon], { icon: L.divIcon({ className: `school ${cls}`, html: mark, iconSize: [16, 16] }), zIndexOffset: 1000 })
      .bindPopup(`<div class="popup"><b>${esc(s.name)}</b><br>${esc(s.road)}<br><span class="muted">${esc(s.source)}</span></div>`);
    Object.assign(m, { school: s, cls });
    bindLabel(m, 'right');
    return m;
  })
).addTo(map)]));

// 이름표 자리: 가까운 학교끼리(예: 옥빛초·중·고) 이름이 겹치지 않게, 줌이 바뀔 때마다 서쪽 학교부터
// 오른쪽→왼쪽→위→아래 중 다른 이름표·학교 아이콘과 겹치지 않는 첫 자리에 둔다 (모두 겹치면 오른쪽).
function placeSchoolLabels() {
  map.getContainer().classList.toggle('zoomed-out', map.getZoom() < 14);
  if (map.getZoom() < 14) return;
  const markers = Object.values(schoolLayers).filter(g => map.hasLayer(g)).flatMap(g => g.getLayers())
    .sort((a, b) => a.school.lon - b.school.lon);
  const pt = m => map.latLngToLayerPoint(m.getLatLng());
  const boxes = markers.map(m => { const p = pt(m); return [p.x - 8, p.y - 8, p.x + 8, p.y + 8]; });
  const hit = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
  for (const m of markers) {
    const el = m.getTooltip().getElement();
    const w = el ? el.offsetWidth : 80, h = el ? el.offsetHeight : 16, p = pt(m);
    const rect = {
      right: [p.x + 8, p.y - h / 2, p.x + 8 + w, p.y + h / 2], left: [p.x - 8 - w, p.y - h / 2, p.x - 8, p.y + h / 2],
      top: [p.x - w / 2, p.y - 8 - h, p.x + w / 2, p.y - 8], bottom: [p.x - w / 2, p.y + 8, p.x + w / 2, p.y + 8 + h],
    };
    const dir = Object.keys(rect).find(d => !boxes.some(b => hit(rect[d], b))) || 'right';
    boxes.push(rect[dir]);
    if (dir !== m.labelDir) bindLabel(m, dir);
  }
}

// 강조: 한 노선만 굵고 진하게, 나머지는 흐리게
function highlight(name) {
  const w = lineW(map.getZoom());
  for (const [n, lines] of Object.entries(routeLines)) for (const l of lines) {
    if (!name) l.setStyle({ weight: w, opacity: 0.9, dashArray: null });
    else if (n === name) l.setStyle({ weight: w + 2, opacity: 1, dashArray: l.direction === 'down' ? '8 6' : null });
    else l.setStyle({ weight: w, opacity: 0.2, dashArray: null });
  }
  if (name) for (const l of routeLines[name]) if (map.hasLayer(l)) l.bringToFront();
  for (const m of markers) {
    const on = !name || m.routes.includes(name);
    m.setStyle({ opacity: on ? 1 : 0.2, fillOpacity: on ? 0.95 : 0.2 });
    if (on && stopLayer.hasLayer(m)) m.bringToFront();
  }
  document.querySelectorAll('.legend .row').forEach(r => r.classList.toggle('active', r.dataset.row === name));
}

function pin(name) {
  pinned = pinned === name ? null : name;
  hovered = null;
  highlight(pinned);
}
map.on('click', () => { if (pinned) pin(pinned); });

// 마우스 강조: 벗어나면 바로 원래 상태(고정 노선 또는 범례에 체크된 전체)로 돌아간다.
// 강조할 때 bringToFront 로 선의 SVG 요소가 옮겨지면 mouseout 이 빠질 수 있어서,
// 지도 위 mousemove 에서 커서 아래가 노선 선이 아니면 강조를 푼다.
let hovered = null;
function hoverOn(name) {
  if (freqMode || pinned || hovered === name) return;
  hovered = name;
  highlight(name);
}
function hoverOff() {
  if (hovered === null) return;
  hovered = null;
  highlight(pinned);
}
map.on('mousemove', e => {
  const t = e.originalEvent.target;
  if (t.closest && t.closest('.legend')) return;   // 범례 위 강조는 범례 이벤트가 맡는다
  if (!(t.classList && t.classList.contains('route-line'))) hoverOff();
});
map.getContainer().addEventListener('mouseleave', hoverOff);

// 선 클릭: 클릭 지점에서 가장 가까운 형상 점의 '같은 길을 지나는 노선'(지도 배치와 같은 기준)과 배차 정보
function segmentPopup(line, clicked) {
  const pts = line.getLatLngs();
  let i = 0, best = Infinity;
  pts.forEach((p, k) => { const d = map.distance(p, clicked); if (d < best) { best = d; i = k; } });
  const here = [line.routeName, ...line.nb[i].map(v => order[Math.abs(v) - 1]).filter(n => visible.has(n))]
    .sort((a, b) => orderIdx[a] - orderIdx[b]);
  let perHour = 0, unknown = [];
  for (const r of here) { const b = routeBph(r); if (b) perHour += b; else unknown.push(r); }
  const rows = here.map(r => {
    const s = schedOf[r] || {};
    return `<tr><td>${badge(r)}</td><td>${alloc(r, 'weekday')}</td><td>${range(s.satMin, s.satMax)}</td>` +
      `<td>${range(s.sunMin, s.sunMax)}</td><td>${s.firstTime ? esc(s.firstTime) + '–' + esc(s.lastTime) : '-'}</td></tr>`;
  }).join('');
  L.popup({ maxWidth: 420 }).setLatLng(pts[i])
    .setContent(`<div class="popup"><b>이 길을 지나는 노선 ${here.length}개</b>` +
      `<table><tr><th>노선</th><th>평일 배차</th><th>토</th><th>일</th><th>기점 첫차–막차</th></tr>${rows}</table>` +
      `<div class="sum">${DAYS[day]} 운행 빈도 합계 약 <b>${perHour.toFixed(1)}대/시간</b>` +
      (perHour ? ` → 합성 배차 약 <b>${(60 / perHour).toFixed(0)}분</b>마다 1대` : '') +
      (unknown.length ? `<br><span class="muted">${unknown.map(esc).join(', ')}: 배차 정보 없음 → 합계에서 제외</span>` : '') +
      `<br><span class="muted">노선별 ${DAYS[day]} 최소·최대 배차의 평균으로 추정한 계획값. 표시된 상행 경로 기준.</span></div></div>`)
    .openOn(map);
}

// 정류장 크기: 축소 화면에서는 작게, 흰 테두리 없이
function sizeStops() {
  const small = map.getZoom() < 14;
  for (const m of markers) {
    const shared = m.routes.length > 1;
    m.setRadius(small ? (shared ? 2.5 : 2) : (shared ? 5 : 4));
    m.setStyle({ weight: small ? 0 : 1.5 });
  }
}
// 운행 빈도 레이어: 켜진 노선마다 형상 점별로 "이 노선 + 같은 길을 지나는 켜진 노선"의 시간당 운행 횟수를 더하고,
// 같은 등급이 이어지는 구간을 길 중심선 하나로 그린다. 여러 노선이 같은 길을 그리면 같은 등급이 같은 자리에 겹친다.
function buildFreq() {
  freqLayer.clearLayers();
  const scale = freqScale(map.getZoom()), runs = [];
  for (const n of order) if (visible.has(n)) for (const line of routeLines[n]) {
    const self = orderIdx[n];
    const vals = line.nb.map(nb => [self, ...nb.map(v => Math.abs(v) - 1)]
      .map(q => order[q]).filter(r => visible.has(r)).reduce((sum, r) => sum + (routeBph(r) || 0), 0));
    // 경계의 잔떨림 제거: 중앙값(±2점, 약 ±40m)
    const med = vals.map((_, i) => { const w = vals.slice(Math.max(0, i - 2), i + 3).sort((a, b) => a - b); return w[w.length >> 1]; });
    const cls = med.map(v => v > 0 ? FREQ_CLASSES.findIndex(c => 60 / v < c.max) : -1);
    const pts = line.getLatLngs();
    for (let s = 0, i = 1; i <= cls.length; i++) {
      if (i < cls.length && cls[i] === cls[s]) continue;
      const to = Math.min(i, cls.length - 1);   // 다음 구간 시작점까지 이어 그려 끊김이 없게
      if (to > s) runs.push({ line, cls: cls[s], pts: pts.slice(s, to + 1) });
      s = i;
    }
  }
  // 흰 테두리(지도 위 가독성) → 연한 등급부터 진한 등급 순으로 쌓아 자주 다니는 길이 위에 오게
  const spec = c => c < 0 ? NO_DATA : FREQ_CLASSES[c];
  runs.sort((a, b) => (b.cls < 0 ? 99 : b.cls) - (a.cls < 0 ? 99 : a.cls));
  for (const r of runs)
    freqLayer.addLayer(L.polyline(r.pts, { color: '#fff', weight: spec(r.cls).w * scale + 3, opacity: 0.85, interactive: false }));
  for (const r of runs) {
    const c = spec(r.cls);
    const band = L.polyline(r.pts, { color: c.color, weight: Math.max(2, c.w * scale), opacity: 1,
                                     dashArray: r.cls < 0 ? '4 5' : null, className: 'freq-line' });
    band.bindTooltip(`${DAYS[day]} 합성 배차 ${c.label} (${c.sub}) · 클릭: 노선별 배차`, { sticky: true });
    band.on('click', e => { L.DomEvent.stopPropagation(e); segmentPopup(r.line, e.latlng); });
    freqLayer.addLayer(band);
  }
  stopLayer.eachLayer(m => m.bringToFront());
}

function setFreqMode(on) {
  freqMode = on;
  hovered = null; pinned = null;
  document.getElementById('freqOpts').hidden = !on;
  refresh();
}

map.on('zoomend', () => { placeSchoolLabels(); layoutLines(); sizeStops(); highlight(pinned); if (freqMode) buildFreq(); });

function refresh() {
  for (const [name, lines] of Object.entries(routeLines))
    for (const l of lines) visible.has(name) && !freqMode ? l.addTo(map) : map.removeLayer(l);
  if (freqMode) { freqLayer.addTo(map); buildFreq(); } else map.removeLayer(freqLayer);
  layoutLines();
  stopLayer.clearLayers();
  for (const m of markers) if (m.routes.some(r => visible.has(r))) stopLayer.addLayer(m);
  if (pinned && !visible.has(pinned)) pinned = null;
  hovered = null;
  sizeStops();
  highlight(pinned);
}

// 범례: 체크박스 = 켜기/끄기, 노선명 = 마우스 올리면 강조, 클릭하면 강조 고정. 오른쪽 = 제목에서 고른 요일의 배차
let legendCollapse = () => {};
map.on('click', () => { if (NARROW && !CAPTURE) legendCollapse(); });   // 모바일: 지도 탭하면 범례 접기
const legend = L.control({ position: 'topright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<div class="head"><h4>양주시 버스 노선 <span class="muted" style="font-weight:400">' +
    `<select id="day">${Object.entries(DAYS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>` +
    '<span class="day-text" id="dayText"></span> 배차</span></h4>' +
    '<button type="button" class="toggle" aria-expanded="true" title="범례 접기/펼치기">접기</button></div>' +
    '<div class="body">' +
    '<label class="all"><input type="checkbox" id="all" checked>전체</label>' +
    META.routes.map(r => `<div class="row" data-row="${esc(r.routeName)}">` +
      `<input type="checkbox" data-route="${esc(r.routeName)}" checked>` +
      `<span class="name" data-name="${esc(r.routeName)}"><span class="swatch" style="background:${r.color}"></span>` +
      `${esc(r.routeName)}번<span class="alloc" data-alloc="${esc(r.routeName)}">${alloc(r.routeName)}</span></span></div>`).join('') +
    '<div class="freq"><label><input type="checkbox" id="freq"><b>운행 빈도 보기</b></label>' +
    '<div id="freqOpts" hidden>' +
    '<span id="freqDay"></span> · 체크한 노선 합계 · 합성 배차간격' +
    FREQ_CLASSES.concat([NO_DATA]).map(c =>
      `<div class="row"><span class="fswatch" style="height:${Math.max(2, c.w * 0.6)}px;background:${c.color}` +
      `${c === NO_DATA ? ';background:repeating-linear-gradient(90deg,' + c.color + ' 0 4px,transparent 4px 8px)' : ''}"></span>` +
      `${c.label} <span class="muted">${c.sub}</span></div>`).join('') +
    '<div class="muted">진하고 굵을수록 버스가 자주 지나는 길.<br>합성 배차 = 60 ÷ (노선별 시간당 운행 횟수 합).<br>' +
    '노선별 운행 횟수 = 60 ÷ 최소·최대 배차 평균 (GBIS 계획값)</div></div></div>' +
    (SCHOOL_LEVELS.length ? '<div class="freq">' + SCHOOL_LEVELS.map(({ level, mark, cls }) =>
      `<label><input type="checkbox" data-school="${level}" checked><span class="school ${cls}">${mark}</span>` +
      `${level} (옥정동 ${SCHOOLS.filter(s => s.level === level).length}곳)</label>`).join('') + '</div>' : '') +
    '<div class="note">같은 길을 지나는 노선은 길 중심에 나란히 붙여 표시<br>' +
    '노선명 클릭: 강조 고정 (지도 클릭으로 해제) · 선 위에 마우스: 강조<br>' +
    '선 클릭: 그 길을 지나는 노선·배차·시간당 운행 수<br>' + META.directionNote +
    '<br>회색 점 = 여러 노선 공유 정류장</div></div>';
  // 접기/펼치기: 모바일(좁은 화면)에서는 접힌 채로 시작해 지도를 가리지 않는다. 캡처 화면은 항상 펼침.
  const btn = div.querySelector('.toggle');
  const setOpen = open => {
    div.classList.toggle('collapsed', !open);
    btn.textContent = open ? '접기' : '범례';
    btn.setAttribute('aria-expanded', open);
  };
  setOpen(CAPTURE || !NARROW);
  btn.addEventListener('click', () => setOpen(div.classList.contains('collapsed')));
  legendCollapse = () => setOpen(false);
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  div.addEventListener('change', e => {
    if (e.target.id === 'freq') return setFreqMode(e.target.checked);
    if (e.target.id === 'day') return setDay(e.target.value);
    const lv = e.target.dataset.school;
    if (lv) { e.target.checked ? schoolLayers[lv].addTo(map) : map.removeLayer(schoolLayers[lv]); return placeSchoolLabels(); }
    const boxes = div.querySelectorAll('input[data-route]');
    if (e.target.id === 'all') boxes.forEach(b => b.checked = e.target.checked);
    visible.clear();
    boxes.forEach(b => b.checked && visible.add(b.dataset.route));
    div.querySelector('#all').checked = visible.size === boxes.length;
    refresh();
  });
  div.addEventListener('click', e => {
    const n = e.target.closest('[data-name]');
    if (n && visible.has(n.dataset.name)) pin(n.dataset.name);
  });
  div.addEventListener('mouseover', e => {
    const n = e.target.closest('[data-name]');
    if (n && visible.has(n.dataset.name)) hoverOn(n.dataset.name); else hoverOff();
  });
  div.addEventListener('mouseleave', hoverOff);
  return div;
};
legend.addTo(map);
function setDay(d) {
  day = d;
  document.getElementById('day').value = d;
  document.getElementById('freqDay').textContent = document.getElementById('dayText').textContent = DAYS[d];
  document.querySelectorAll('[data-alloc]').forEach(el => el.textContent = alloc(el.dataset.alloc));
  map.closePopup();
  refresh();
}

// 초기 화면: 옥정동 확대 — 이름에 '옥정'이 들어간 표시 정류장이 모두 들어오는 범위, 오른쪽 범례에 가리지 않게.
// 선의 투영·스타일 변경은 지도 view 가 정해진 뒤에 해야 하므로 refresh() 는 그 다음에 한다.
// ?view=all 이면 전체 노선 범위. ?day=sat|sun 이면 그 요일 배차로, ?freq=1 이면 운행 빈도 보기로 시작.
// 모바일은 범례가 접힌 제목줄뿐이라 옆 여백 대신 위 여백만 둔다.
const legendEl = document.querySelector('.leaflet-top.leaflet-right .legend');
const legendW = legendEl?.offsetWidth || 0, legendH = legendEl?.offsetHeight || 0;
const target = Q.get('view') === 'all' || !META.focus
  ? L.featureGroup(Object.values(routeLines).flat()).getBounds() : L.latLngBounds(META.focus);
map.fitBounds(target, NARROW && !CAPTURE
  ? { paddingTopLeft: [10, legendH + 20], paddingBottomRight: [10, 20] }
  : { paddingTopLeft: [30, 30], paddingBottomRight: [legendW + 30, 30] });
if (DAYS[Q.get('day')]) day = Q.get('day');
document.getElementById('day').value = day;
document.getElementById('freqDay').textContent = document.getElementById('dayText').textContent = DAYS[day];
document.querySelectorAll('[data-alloc]').forEach(el => el.textContent = alloc(el.dataset.alloc));
if (Q.get('freq')) {
  document.getElementById('freq').checked = true;
  setFreqMode(true);
} else refresh();
placeSchoolLabels();
</script>
</body>
</html>
